version: '3.9'
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '5001:5001'
    env_file:
      - .env
    depends_on:
      - redis
      - db
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: murotech
    ports:
      - '5432:5432'
