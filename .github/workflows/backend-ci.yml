name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint dependencies
        run: pip install flake8==6.1.0
      - name: Run flake8
        run: flake8 app/ fiscal/ --max-line-length=120 --extend-ignore=E203,W503,E402,F401,F841

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run all tests with coverage
        env:
          SECRET_KEY: ci-test-secret-key-32-chars-min!!
          ENCRYPTION_KEY: ci-encryption-key-placeholder-32char
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///:memory:
          CSRF_SECRET: ci-csrf-secret
        run: |
          coverage run -m pytest tests/ -v
          coverage report -m --fail-under=50

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: backend
        run: docker build -f docker/Dockerfile -t murotech-backend:ci .
