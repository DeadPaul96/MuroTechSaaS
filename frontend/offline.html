<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión — MUROTECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #000a1e;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .offline-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
        }
        .offline-icon {
            width: 80px; height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 2rem;
            color: white;
            box-shadow: 0 8px 24px rgba(30,64,175,0.3);
        }
        h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 12px; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
        .btn-retry {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white; border: none; border-radius: 12px;
            padding: 14px 28px; font-size: 0.95rem; font-weight: 800;
            cursor: pointer; font-family: inherit;
            transition: opacity 0.2s;
        }
        .btn-retry:hover { opacity: 0.9; }
        .btn-retry:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon"><i class="fas fa-wifi-slash"></i></div>
        <h1>Sin conexión a internet</h1>
        <p>No se pudo conectar con el servidor. Verifica tu conexión e intenta de nuevo.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="fas fa-redo"></i> Reintentar
        </button>
    </div>
</body>
</html>
