<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SuperAdmin - MUROTECH</title>
    <link rel="stylesheet" href="../css/shared/tokens.css">
    <link rel="stylesheet" href="../css/shared/base.css">
    <link rel="stylesheet" href="../css/superAdmin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div id="superadmin-screen">
        <aside class="sidebar"></aside>
        <main class="sa-main">
            <div class="sa-card">
                <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <div>
                        <h1 style="color:#0f172a; font-size:2.4rem; margin:0; font-family:var(--font-display); letter-spacing:-1.5px; font-weight:900;">SuperAdmin</h1>
                        <p style="color:#64748b; font-weight:600; font-size:1rem; margin-top:2px;">Panel de administración global</p>
                    </div>
                </header>
                <div id="superadmin-content">
                    <p style="text-align:center; color:#94a3b8; padding:60px 0;">Cargando panel de administración...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/shared/sidebar.js"></script>
    <script src="../js/shared/utils.js"></script>
    <script src="../js/superAdmin.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
