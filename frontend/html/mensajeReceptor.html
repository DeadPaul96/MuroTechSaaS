<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mensaje Receptor — MUROTECH</title>
    <meta name="description" content="Aceptación o rechazo de comprobantes electrónicos recibidos">

    <link rel="stylesheet" href="../css/shared/tokens.css">
    <link rel="stylesheet" href="../css/shared/base.css">
    <link rel="stylesheet" href="../css/inventario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="../js/shared/config.js?v=2"></script>
    <script src="../js/shared/utils.js?v=2"></script>
    <script src="../js/shared/sidebar.js"></script>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="reg-body">
    <canvas id="particles-canvas"></canvas>

    <div id="billing-screen">
        <aside class="sidebar"></aside>

        <main class="module-content inv-main">
            <div class="inv-card">

                <!-- ─── HEADER ─────────────────────────────────────────── -->
                <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
                    <div>
                        <h1 style="color:#0f172a; font-size:2.8rem; margin:0; font-family:var(--font-display); letter-spacing:-1.5px; font-weight:900;">Mensaje Receptor</h1>
                        <p style="color:#64748b; font-weight:600; font-size:1.1rem; margin-top:4px;">Aceptación o rechazo de comprobantes electrónicos recibidos — MH v4.4</p>
                    </div>
                </header>

                <div style="display:flex; flex-direction:column; gap:22px;">

                    <!-- Formulario nuevo Mensaje Receptor -->
                    <div class="section-box">
                        <h3 class="section-title">
                            <i class="fas fa-envelope-open-text"></i> Nuevo Mensaje Receptor
                        </h3>

                        <form id="addMensajeForm">
                            <div class="form-grid-2" style="margin-bottom:14px;">
                                <div>
                                    <label class="label-sm" for="mr-clave">Clave del Comprobante (50 dígitos)</label>
                                    <input type="text" id="mr-clave" class="fi" placeholder="506280624003..." maxlength="50" required>
                                </div>
                                <div>
                                    <label class="label-sm" for="mr-tipo">Tipo de Mensaje</label>
                                    <select id="mr-tipo" class="premium-select">
                                        <option value="1">Aceptar (1)</option>
                                        <option value="2">Aceptar Parcial (2)</option>
                                        <option value="3">Rechazar (3)</option>
                                    </select>
                                </div>
                            </div>

                            <div style="margin-bottom:14px;">
                                <label class="label-sm" for="mr-detalle">Detalle del Mensaje (opcional, máx. 80 caracteres)</label>
                                <textarea id="mr-detalle" class="fi" placeholder="Motivo o detalle adicional..." maxlength="80" style="height: auto; min-height: 45px; resize: none; padding: 10px;"></textarea>
                            </div>

                            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                                <button type="submit" class="btn-registrar" id="btn-generar-mensaje" style="background:linear-gradient(135deg,#1e40af,#3b82f6);">
                                    <i class="fas fa-paper-plane" style="margin-right:10px;"></i> GENERAR MENSAJE
                                </button>
                                <button type="button" class="btn-registrar" id="btn-aceptar-rapido" style="background:linear-gradient(135deg,#16a34a,#22c55e);">
                                    <i class="fas fa-check-circle" style="margin-right:10px;"></i> ACEPTAR (1)
                                </button>
                                <button type="button" class="btn-registrar" id="btn-rechazar-rapido" style="background:linear-gradient(135deg,#dc2626,#ef4444);">
                                    <i class="fas fa-times-circle" style="margin-right:10px;"></i> RECHAZAR (3)
                                </button>
                            </div>
                        </form>
                    </div><!-- /formulario nuevo mensaje -->

                    <!-- Header del listado -->
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                        <div style="position:relative; flex:0 1 450px;">
                            <div class="autocomplete-wrapper">
                                <i class="fas fa-search" style="position:absolute; left:18px; top:50%; transform:translateY(-50%); color:#94a3b8; z-index:10;"></i>
                                <input type="text" id="buscar-mensajes" class="fi" placeholder="🔍 Buscar por clave…" autocomplete="off" style="padding-left:45px; width:100%; height:50px; font-weight:700; border-radius:25px; border:2px solid #e2e8f0; transition:all 0.3s;">
                            </div>
                        </div>
                        <div id="total-mensajes-badge" style="background:var(--primary-light); color:var(--primary); padding:10px 20px; border-radius:20px; font-weight:900; font-size:0.85rem; border:1px solid #dbeafe;">
                           <i class="fas fa-envelope"></i> 0 Mensajes
                        </div>
                    </div>

                    <!-- Tabla de Mensajes -->
                    <div class="data-table-container">
                        <div style="max-height: 60vh; overflow-y: auto;">
                            <table class="premium-data-table dense-table">
                                <thead>
                                    <tr>
                                        <th>Clave</th>
                                        <th>Tipo</th>
                                        <th>Detalle</th>
                                        <th>Estado</th>
                                        <th>Fecha</th>
                                        <th style="text-align:center;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="lista-mensajes">
                                    <!-- Los mensajes se inyectarán aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div><!-- /flex column -->
            </div><!-- /inv-card -->
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Lógica de Mensaje Receptor -->
    <script src="../js/mensajeReceptor.js?v=2"></script>

    <!-- Partículas animadas -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
